name: Build and Release UNI_CONV

on:
  push:
    tags:
      - 'uni-conv-v*' # Tự động chạy khi bạn đẩy một tag có tên bắt đầu bằng "uni-conv-v" (ví dụ: uni-conv-v0.1.0)
  workflow_dispatch: # Cho phép bạn bấm nút chạy bằng tay trên trang web Github

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            file_name: uni_conv
            asset_name: uni_conv-linux
          - os: windows-latest
            file_name: uni_conv.exe
            asset_name: uni_conv-windows.exe
            
    # Cấp quyền cho Action được tạo Release
    permissions:
      contents: write

    steps:
      - name: Tải mã nguồn về máy chủ
        uses: actions/checkout@v4

      - name: Cài đặt ngôn ngữ Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Biên dịch phần mềm
        run: |
          cd RS_AI/UNI_CONV.rs
          cargo build --release

      - name: Đổi tên file để phân biệt hệ điều hành
        shell: bash
        run: |
          cd RS_AI/UNI_CONV.rs/target/release
          mv ${{ matrix.file_name }} ${{ matrix.asset_name }}

      - name: Tạo Release và đính kèm File chạy
        uses: softprops/action-gh-release@v2
        with:
          name: UNI_CONV ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: RS_AI/UNI_CONV.rs/target/release/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
