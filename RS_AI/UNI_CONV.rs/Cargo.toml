[package]
name = "uni_conv"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.30"
indicatif = "0.17"
inquire = "0.7"
shellexpand = "3.1"
filetime = "0.2"
anyhow = "1.0"
regex = "1.10"
crossterm = "0.27"
serde_yml = "0.0.12"
ctrlc = "3.5.2"
once_cell = "1.21.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
