[package]
name = "filen_gui_tauri"
version = "0.1.0"
edition = "2021"

# Standalone crate (not part of the parent workspace) — Tauri uses its own
# build pipeline (tauri-build) and target dir.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# re-export core modules from workspace
filen_gui = { path = ".." }
notify = "8.2.0"
walkdir = "2.5"
tauri-plugin-drag = "2.1.1"
trash = "5.2.6"
fuzzy-matcher = "0.3.7"
urlencoding = "2.1.3"
libc = "0.2.189"
tauri-plugin-shell = "2.3.5"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
