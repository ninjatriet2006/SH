[package]
name = "universe-manager-gui"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
name = "universe_manager_gui_bridge"
crate-type = ["rlib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rfd = "=0.16.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
universe_manager_backend = { path = "../backend" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
