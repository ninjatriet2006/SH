[package]
name = "workbuddy_gui"
version = "0.1.0"
description = "WorkBuddy Gateway Manager — Tauri v2 GUI"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "workbuddy_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "signal"] }
ureq = { version = "2.9", features = ["json"] }
rand = "0.8"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
hyper = { version = "1", features = ["full"] }
tower = "0.5"
parking_lot = "0.12"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
sha2 = "0.10"
tokio-stream = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
base64 = "0.22"
keyring = "3"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
