[package]
name = "vpn_ai_proxy_gui"
version = "0.1.0"
description = "VPN AI Proxy Gateway GUI — Tauri v2"
authors = ["bimatkeo"]
edition = "2024"

[lib]
name = "vpn_ai_proxy_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "process", "io-util"] }
axum = { version = "0.8", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["socks", "rustls-tls", "stream", "json"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tauri = { version = "2.11.3", features = [] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "fast-rng"] }
# NOTE: đã xóa dep chết (0 lần dùng trong src/): hyper, hyper-util, tauri-plugin-dialog, log.

