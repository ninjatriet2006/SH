[package]
name = "universal-converter-gui"
version.workspace = true
edition.workspace = true

[lib]
name = "universal_converter_gui_bridge"
crate-type = ["rlib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
fs2 = "=0.4.3"
rfd = "=0.16.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
ron = "=0.8.1"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
universal_converter_backend = { path = "../backend" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
