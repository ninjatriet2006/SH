[package]
name = "universal_converter_gui"
version.workspace = true
edition.workspace = true

[dependencies]
universal_converter = { path = "../../TUI/universal_converter" }
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[features]
default = ["glow"]
glow = ["eframe/default"]
wgpu = ["eframe/wgpu"]
