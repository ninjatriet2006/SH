[package]
name = "account_hub_gui"
version = "0.1.0"
description = "Account Hub - Gmail & Web Platform Manager"
authors = ["bimatkeo"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "account_hub_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
