[package]
name = "filen_gui_tauri"
version = "0.1.0"
edition = "2021"

# Standalone crate (not part of the parent workspace) — Tauri uses its own
# build pipeline (tauri-build) and target dir.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# re-export core modules from workspace
filen_gui = { path = ".." }
