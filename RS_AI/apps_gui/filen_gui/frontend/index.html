<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filen File Manager — GUI</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <!-- ── Top bar ─────────────────────────────────────────── -->
      <header id="top-bar" class="top-bar">
        <div class="top-left">
          <span class="app-logo">☁️</span>
          <span class="app-title">Filen File Manager</span>
        </div>
        <nav class="top-nav">
          <button class="nav-tab active" data-view="explorer">Explorer</button>
          <button class="nav-tab" data-view="recents">🕘 Gần đây</button>
          <button class="nav-tab" data-view="sync">🔄 Đồng bộ</button>
          <button class="nav-tab" data-view="servers">🖥️ Servers</button>
        </nav>
        <div class="top-right">
          <span class="account-pill" id="account-pill">👤 Chưa đăng nhập</span>
        </div>
      </header>

      <div class="body-row">
        <!-- ── Sidebar ───────────────────────────────────────── -->
        <aside id="sidebar" class="sidebar">
          <section class="side-section">
            <h3 class="side-heading">Địa điểm</h3>
            <button class="side-item" data-place="home">🏠 Trang chủ</button>
            <button class="side-item" data-place="desktop">🖥️ Máy tính</button>
            <button class="side-item" data-place="documents">📁 Tài liệu</button>
            <button class="side-item" data-place="downloads">⬇️ Tải xuống</button>
          </section>
          <section class="side-section">
            <h3 class="side-heading">Filen Cloud</h3>
            <button class="side-item active" data-view="explorer">☁️ Cloud</button>
          </section>
          <section class="side-section">
            <h3 class="side-heading">Tài khoản</h3>
            <button class="side-item" id="btn-login">🔑 Đăng nhập mới</button>
            <button class="side-item disabled" id="btn-logout" disabled>🚪 Đăng xuất</button>
          </section>
        </aside>

        <!-- ── Central: dual-pane container ──────────────────── -->
        <main id="central" class="central">
          <div class="pane" id="pane-left">
            <div class="pane-header">
              <span class="pane-side-label">🖥️ Cục bộ</span>
              <div class="pane-actions">
                <button class="btn">⬆</button>
                <button class="btn">🏠</button>
                <button class="btn">⟳</button>
              </div>
              <input class="pane-filter" type="text" placeholder="Lọc…" />
            </div>
            <div class="pane-breadcrumb">/</div>
            <div class="pane-body">
              <div class="pane-placeholder">Danh sách thư mục cục bộ — sẽ hiển thị ở đây</div>
            </div>
          </div>
          <div class="pane-divider" id="pane-divider"></div>
          <div class="pane" id="pane-right">
            <div class="pane-header">
              <span class="pane-side-label">☁️ Cloud</span>
              <div class="pane-actions">
                <button class="btn">⬆</button>
                <button class="btn">🏠</button>
                <button class="btn">⟳</button>
              </div>
              <input class="pane-filter" type="text" placeholder="Lọc…" />
            </div>
            <div class="pane-breadcrumb">/</div>
            <div class="pane-body">
              <div class="pane-placeholder">Danh sách Filen Cloud — sẽ hiển thị ở đây</div>
            </div>
          </div>
        </main>
      </div>

      <!-- ── Bottom: transfer drawer ────────────────────────── -->
      <footer id="transfer-drawer" class="transfer-drawer">
        <div class="drawer-toggle" id="drawer-toggle">
          <span id="drawer-label">⬇️ Transfer (0) — bấm để mở</span>
        </div>
        <div class="drawer-body" id="drawer-body">
          <div class="drawer-placeholder">Hàng đợi transfer (upload/download/copy/move) — trống</div>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
