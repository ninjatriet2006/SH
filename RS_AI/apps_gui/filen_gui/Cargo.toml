[package]
name = "filen_gui"
version.workspace = true
edition.workspace = true

[dependencies]
eframe = "0.31"
egui = "0.31"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
dirs = "5.0"
which = "5.0"

[features]
default = ["glow"]
glow = ["eframe/default"]
wgpu = ["eframe/wgpu"]
