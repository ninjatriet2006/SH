[package]
name = "universe_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
dialoguer = "0.11"
walkdir = "2.4"
dirs = "5.0"
tempfile = "3.8"
chrono = "0.4"

[[bin]]
name = "universe_manager_tui"
path = "src/main.rs"
