[package]
name = "filen_tui"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tui-textarea = "0.4"
dirs = "5.0"
which = "5.0"
libc = "0.2"
serde_yaml = "0.9"
fs_extra = "1.3.0"

